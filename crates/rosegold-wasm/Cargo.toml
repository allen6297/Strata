[package]
name = "rosegold-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM bindings for the RoseGold interpreter (browser Play)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rosegold = { path = "../rosegold" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
